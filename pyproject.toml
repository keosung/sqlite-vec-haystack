[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlite-vec-haystack"
version = "0.1.0"
description = "Haystack 2.x DocumentStore + Retriever backed by sqlite-vec — embedded vector search in a single SQLite file, cross-platform."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
  "haystack",
  "sqlite-vec",
  "vector-database",
  "rag",
  "embedded",
  "on-device",
]
authors = [{ name = "Keoseong Park", email = "keosung.park@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "haystack-ai>=2.27.0",
  "sqlite-vec>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/keosung/sqlite-vec-haystack"
Issues = "https://github.com/keosung/sqlite-vec-haystack/issues"
Source = "https://github.com/keosung/sqlite-vec-haystack"

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.envs.default]
dependencies = ["ruff"]

[tool.hatch.envs.default.scripts]
fmt = "ruff check --fix {args}; ruff format {args}"
fmt-check = "ruff check {args} && ruff format --check {args}"

[tool.hatch.envs.test]
dependencies = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "mypy",
]

[tool.hatch.envs.test.scripts]
unit = 'pytest -m "not integration" {args:tests}'
integration = 'pytest -m "integration" {args:tests}'
all = 'pytest {args:tests}'
unit-cov = 'pytest --cov=haystack_integrations -m "not integration" {args:tests}'
types = "mypy -p haystack_integrations.components.retrievers.sqlite_vec -p haystack_integrations.document_stores.sqlite_vec {args}"

[tool.mypy]
install_types = true
non_interactive = true
check_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C",
  "D205",
  "D209",
  "D213",
  "D417",
  "D419",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "B027",
  "ANN401",
  "FBT003",
  "S105",
  "S106",
  "S107",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "ARG002",
  "S101",
]
exclude = ["examples"]

[tool.ruff.lint.isort]
known-first-party = ["haystack_integrations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252", "D", "ANN"]
"examples/**/*" = ["T201", "D", "ANN"]
"scripts/**/*" = ["T201", "D", "ANN", "RUF100"]

[tool.coverage.run]
source = ["haystack_integrations"]
branch = true
relative_files = true
parallel = false

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py"]
show_missing = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
minversion = "6.0"
markers = ["integration: integration tests"]
