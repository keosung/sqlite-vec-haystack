name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        haystack-version: ["3.*"]
        include:
          # the Haystack 2.x line is also supported — keep one job covering it
          - python-version: "3.12"
            haystack-version: "2.*"
    name: Python ${{ matrix.python-version }} / haystack-ai ${{ matrix.haystack-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "haystack-ai==${{ matrix.haystack-version }}"
          pip install pytest pytest-asyncio
      - name: Test
        run: pytest -q
      - name: Run examples
        run: |
          python examples/quickstart.py
          python examples/async_pipeline.py
